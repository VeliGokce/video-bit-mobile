name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk BitShift-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BitShift-Android
          path: BitShift-Android.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BitShift-Android.apk
          generate_release_notes: true
